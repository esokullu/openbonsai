# Qwen3.5-9B -> ternary, calibrated and distilled on the model's OWN answers to math and code
# prompts. ScaleQ's finding (AYOT): calibration on generic text keeps perplexity but loses
# reasoning. Our generic run (examples/qwen3_5-9b.yaml: WikiText-2, UltraChat and 32 blocks of
# chat traces) scored GSM8K 30/100 and HumanEval 6/50 with thinking off, against 77/100 and 44/50
# for BF16. Rotation, GPTQ, endpoints and export are the same as there; the data changes:
#
#   traces     1,520 prompts from TRAINING splits, answered greedily in the model's own chat template:
#              math 640 (400 GSM8K + 240 MATH levels 1-3) and code 420 (140 MBPP + 280
#              OpenCodeInstruct) with thinking on and a 1,536-token cap; 260 math and code (160 GSM8K
#              + 100 MBPP) with thinking off and a 768-token cap, the mode of the headline scores
#              above; 200 UltraChat first turns with thinking off and a 512-token cap
#   calibrate  256 blocks of 2,048 tokens: 64 WikiText-2, 64 UltraChat, 128 traces (half)
#   distill    1,536 teacher sequences: 256 WikiText-2, 640 UltraChat, 640 traces (42%); the group
#              scales only (train.small: false)
#   eval       dev, extended, compare, gsm8k, humaneval; thinking off (100/50 problems, batch 16)
#              and on (the first 50/25, 4,096-token cap, batch 8)
#
#   openbonsai run --config examples/qwen3_5-9b-reasoning.yaml --out runs/qwen3_5-9b-reasoning
#
# These are the settings of the run behind the previous Hugging Face model (GGUF sha256 4f2f3d10...,
# still at revision 40964de there, tag reasoning-mix-v1; examples/qwen3_5-9b-reasoning-code.yaml
# made the current one),
# research/runs/2026-10-27-reasoning-mix-v1/run.yaml (it read UltraChat from a local copy of the same
# pinned file, offline).
#
# Trace volume (estimated before the run, then measured). The BF16 model's thinking-on GSM8K TEST
# answers (research/runs/2026-10-27-reasoning-v1) average 1,361 generated tokens when cut at 1,536,
# and 30 of 50 reach that cap (verbose double-checking, not loops); its HumanEval ones average 885;
# with thinking off GSM8K answers average 370 at a 512 cap (21 of 100 cut) and HumanEval 221. Assuming
# GSM8K 1,361, MATH 1,450 (harder, mostly cut), MBPP 900, OpenCodeInstruct 1,200 (longer specs),
# thinking off GSM8K 410 and MBPP 250, and UltraChat 420 (thinking off, 512):
#
#   source               n   thinking  cap    generated (est.)  measured
#   gsm8k_train        400   on        1536     544K              553K
#   math_train         240   on        1536     348K              357K
#   mbpp_train         140   on        1536     126K              123K
#   opencodeinstruct   280   on        1536     336K              340K
#   ultrachat          200   off        512      84K               77K
#   gsm8k_train_off    160   off        768      66K               62K
#   mbpp_train_off     100   off        768      25K               31K
#   generated                                 ~1.53M             1.54M  (math 63%, code 32%, chat 5%)
#   + prompts (194K, Qwen3.5 tokenizer): 1,736,153 trace tokens = 847 blocks of 2,048
#
# Time: a batch runs until its longest row stops, and nearly every thinking batch runs to the cap
# (40-60% of single answers do), so the time is about the decode steps, the sum over batches of the
# cap. At traces.batch_tokens 14,000 (below) the traces make 167 batches: 137 thinking batches x
# 1,536 + 18 x 768 + 12 x 512 = ~230K steps at most. Measured: 9,213 s of generation (2.6 h, 167
# tokens/s); a thinking batch of 8 took 65-90 s (17-24 steps/s). The log shows tokens/s and an ETA
# after every batch. Every batch is cached (traces/cache/), so an interrupted run resumes where it
# stopped.
#
# Memory and speed: batch 8 x (~150 + 4,096) = ~34K tokens in flight peaked at 28.7 GB on the 32 GB
# card (9B BF16), and batch 16 x 4,096 (~68K) stalled: on Windows the driver pages to system memory
# instead of raising out-of-memory, so the split-on-OOM fallback never runs. traces.batch_tokens caps
# rows x (longest prompt + cap) per batch. The run first used 32,768, which put 16 GSM8K prompts in a
# thinking batch (~26K tokens) and decoded about 113 tokens/s; it was restarted at 14,000: 8 per
# thinking batch (~13K), 127-215 tokens/s (mean 173). Longest-first batches put a source's longest
# prompts together (UltraChat's reach 2,049 tokens, MATH's 883, OpenCodeInstruct's 603), so the
# first UltraChat and MATH batches hold 5 prompts and OpenCodeInstruct's 6.
#
# The traces stop short? Trace-backed blocks are never capped: calibrate and the distillation
# teacher read their n blocks from the start of traces/traces.jsonl (interleaved across the sources,
# so any prefix holds every source in proportion) and refuse a file that is too short. openbonsai
# run checks that right after the traces stage (and before the first stage on a rerun), naming each
# count and the blocks available, before quantize starts. If the traces make fewer than the
# teacher's 640 blocks, lower distill.teacher.sources.2.n (traces) to the blocks available and
# raise distill.teacher.sources.1.n (UltraChat) by the same amount (e.g. 576 and 704), then rerun
# the same command: the traces stage is complete and is skipped.
#
# GPU time measured on one RTX 5090 (research/runs/2026-10-27-reasoning-mix-v1/logs):
#   traces 2.6 h | calibrate <1 min | quantize 16 min | endpoints 2 min
#   distill: teacher 6 min + training 34 min (192 steps of ~10.6 s) | export and verify 2 min
#   eval: dev, extended, compare ~1 min; gsm8k + humaneval thinking off ~3 min, on ~25 min
#   total about 4.1 h (the run took 4 h 23 min, with two restarts of the traces stage)
#
# Contamination: these are TRAINING splits. GSM8K TEST and HumanEval problems (the reasoning
# suites) and the extended suite's chat-NLL prompts are refused (openbonsai/eval/heldout.py), and
# training rows that share a 13-word run with a test problem (4 GSM8K train questions written from a
# test question's template; 3 OpenCodeInstruct inputs of the first shard, two of them restating
# HumanEval/123's Collatz description) are skipped while sampling and listed in traces/summary.json.
# Tasks restated in other words are not caught: MBPP and OpenCodeInstruct train restate some
# HumanEval tasks (docs/evaluation.md#keeping-test-data-out).
model:
  path: Qwen/Qwen3.5-9B
  revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  dtype: bfloat16
  device: auto
  attn: sdpa
rotation:
  group: 128
  max_block: 4096
  signs: {mode: seeded, seed: width}
  impl: dense
traces:
  # Each source: n prompts in a seeded order (a larger n extends a smaller one), its own thinking
  # switch, cap and batch; prompts are sorted by length within a source. Pinned files: openai/gsm8k
  # @ 740312a main train; EleutherAI/hendrycks_math @ 21a5633 <subject>/train (7 subjects);
  # google-research-datasets/mbpp @ 4bb6404 full train; nvidia/OpenCodeInstruct @ 8f3ba5b shard 0;
  # HuggingFaceH4/ultrachat_200k @ 8049631 (rows 5,000-5,999, below the calibration rows).
  seed: 0                  # interleaving of the sources in traces.jsonl
  batch_tokens: 14000      # rows x (longest prompt + cap) per batch (Memory and speed, above)
  sources:
    # GSM8K and MATH prompts end with the GSM8K suite's line (Qwen's math prompt): reason step by step,
    # final answer in \boxed{}. MATH levels 4-5 would mostly run out of tokens mid-thought at 1,536.
    - {kind: gsm8k_train, n: 400, seed: 1, thinking: on, max_new_tokens: 1536, batch: 16}
    - {kind: math_train, n: 240, seed: 2, levels: [1, 2, 3], thinking: on, max_new_tokens: 1536, batch: 16}
    # MBPP: its task text and first test, in MBPP's own prompt. OpenCodeInstruct: the input as
    # written; inputs over 2,000 characters (about 1%) are skipped.
    - {kind: mbpp_train, n: 140, seed: 3, thinking: on, max_new_tokens: 1536, batch: 16}
    - {kind: opencodeinstruct, n: 280, seed: 4, max_chars: 2000, thinking: on, max_new_tokens: 1536, batch: 16}
    - {kind: ultrachat, n: 200, rows: [5000, 6000], seed: 5090, thinking: off, max_new_tokens: 512, batch: 32}
    # The headline scores are thinking off, so some math and code answers are too (other seeds: mostly
    # other prompts; a prompt answered in both modes gives two different traces).
    - {kind: gsm8k_train, name: gsm8k_train_off, n: 160, seed: 5, thinking: off, max_new_tokens: 768, batch: 16}
    - {kind: mbpp_train, name: mbpp_train_off, n: 100, seed: 6, thinking: off, max_new_tokens: 768, batch: 16}
calibrate:
  seq_len: 2048
  seed: 0
  sources:
    - {kind: wikitext2, n: 64}                 # Salesforce/wikitext @ b08601e, train split
    - {kind: ultrachat, n: 64, min_row: 6000}  # HuggingFaceH4/ultrachat_200k @ 8049631, train_sft shard 0
    - {kind: traces, n: 128}                   # the first 128 blocks of traces/traces.jsonl (~15% of it)
quantize:
  damp: 0.01
  batch: 4
endpoints:
  head: ternary
  embedding: ternary
  damp: 0.01
  chunk: 16384
  batch: 4
distill:
  teacher:
    n_seq: 1536            # the sources below sum to it
    seq_len: 2048
    seed: 1
    shard: 64
    topk: 64
    sources:
      - {kind: wikitext2, n: 256}
      - {kind: ultrachat, n: 640, min_row: 6000}
      - {kind: traces, n: 640}                 # the first 640 blocks of traces.jsonl (~1.31M tokens)
  train: {scales: true, small: false}   # small: also norms, conv1d, in_proj_a/b, A_log, dt_bias (not tried on this recipe)
  lr: 1.0e-3
  lr_small: 1.0e-4         # used with small: true (vector-like tensors)
  lr_small_mat: 2.0e-5     # used with small: true (conv1d, in_proj_a/b)
  epochs: 1
  accum: 8
  warmup: 10
  chunk: 512
  log_every: 5
  ckpt_every: 16
export:
  format: ptq1_0-gguf
  verify: true
eval:
  from: auto
  suites: [dev, extended, compare, gsm8k, humaneval]
  reasoning:
    thinking: [off, on]
    max_new_tokens: 512
    max_new_tokens_thinking: 4096
    batch: 16
    batch_thinking: 8
    gsm8k: {n: 100, n_thinking: 50}
    humaneval: {n: 50, n_thinking: 25}
  generations: true
