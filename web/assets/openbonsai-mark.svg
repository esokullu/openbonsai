    <path d="M137 103c8-6 14-11 16-19l5 1c-1 10-8 18-18 24l-3-6Z"/>
    <path d="M116 175c-6 0-13 2-19 5h15l8-3 8 3h15c-6-4-14-6-21-6l-6 1Z"/>
