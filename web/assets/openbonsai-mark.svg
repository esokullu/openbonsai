    <!-- The trunk tapers into the canopy; open space keeps the branches legible. -->
    <path d="M106 177c9-9 12-18 9-29-3-10-3-17 5-26 7-8 13-15 13-23 0-7-3-14-7-20l7-2c8 10 11 19 8 29-3 11-13 19-16 28-3 8 2 16 2 24 0 6-2 12-5 17l15 4h-37l6-2Z"/>
