    <path d="M82 179h78a3 3 0 0 1 0 6H82a3 3 0 0 1 0-6Z"/>
    <path d="M86 188h70l-6 9a7 7 0 0 1-6 3H98a7 7 0 0 1-6-3l-6-9Z"/>
