<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-labelledby="title description">
  <title id="title">OpenBonsai</title>
  <desc id="description">A small, windswept bonsai with a curved trunk and three compact canopies, rooted in a shallow pot inside a circle.</desc>
  <circle cx="120" cy="120" r="106.5" stroke="#000" stroke-width="3.5"/>
  <g fill="#000">
