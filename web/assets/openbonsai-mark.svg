    <path d="M48 116c-5-2-5-7-1-10 0-5 5-8 11-7 2-6 9-9 15-6 5-5 13-5 18 0 7-2 13 2 14 8 6 0 10 5 8 10 4 2 5 5 3 8-20 3-47 3-68-3Z"/>
