[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbonsai"
version = "0.1.0"
description = "OpenBonsai: experimental rotated ternary calibration and packing for native Qwen3.5"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["torch>=2.6,<3", "transformers>=5.20.2,<5.21", "accelerate>=1.15,<2", "safetensors>=0.8,<1"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
evaluation = ["psutil>=7.2,<8"]

[project.scripts]
openbonsai = "openbonsai.__main__:main"

[project.urls]
Repository = "https://github.com/esokullu/openbonsai"

[tool.setuptools.packages.find]
include = ["openbonsai*"]

[tool.pytest.ini_options]
# research/ keeps legacy tests for reading only; CI never collects or imports it.
testpaths = ["tests"]
norecursedirs = ["research", "runs", ".*", "build", "dist", "*.egg-info"]
